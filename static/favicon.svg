<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Beautiful glowing background gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Outer circular border in brand blue -->
  <circle cx="50" cy="50" r="46" fill="#0b0f19" stroke="#2563eb" stroke-width="4"/>
  <circle cx="50" cy="50" r="40" fill="url(#glow)"/>
  
  <!-- Stylized central Radio / Podcast emoji, vertically and horizontally centered -->
  <text x="50" y="52" font-size="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" dominant-baseline="central" text-anchor="middle">📻</text>
</svg>
