name: Docker Publish

on:
  push:
    branches: [ "**" ] # Käivitub igal pushil ükskõik millisesse harusse

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Need õigused on vajalikud, et GITHUB_TOKEN saaks GHCR-i kirjutada
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # Logime sisse automaatse ja alati saadaval oleva GITHUB_TOKEN'iga
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR nõuab, et repode nimed oleksid väiketähed. GitHubi kasutajanimed võivad aga olla suurtähtedega (nt Cougar).
      # See samm teeb "Cougar/OmaTasku" nime kindlalt väiketäheliseks "cougar/omatasku"-ks.
      - name: Lowercase the repository name and store to env
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@8e671d84a3bd81afdfc4fdbb96a42b07c2a80934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Kui oleme 'main' harus: lisa 'latest' ja lühike giti räsi (nt 'sha-a1b2c3d')
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            # Kui oleme muus harus: kasuta ainult haru nime (nt 'feat-docker')
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
